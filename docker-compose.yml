services:
  mysql:
    image: mysql:8.0
    container_name: bunary_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bunary_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:latest
    container_name: bunary_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongopassword123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-bunary_mongo}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: bunary_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data:
    name: bunary_mysql_data
  mongo_data:
    name: bunary_mongo_data